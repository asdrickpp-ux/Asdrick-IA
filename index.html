<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#03040a">
<title>Asdrick AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#03040a;
}

body{
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,
textarea{
    font:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

.app{
    position:relative;
    width:100%;
    height:100dvh;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(95,70,255,.13),
            transparent 35%
        ),
        #03040a;
}

/* =====================================================
   HUD
===================================================== */

.hud{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.hud-grid{
    position:absolute;
    inset:-30%;

    opacity:.11;

    background-image:
        linear-gradient(
            rgba(91,109,255,.18) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(91,109,255,.18) 1px,
            transparent 1px
        );

    background-size:38px 38px;

    transform:
        perspective(500px)
        rotateX(60deg)
        translateY(100px);

    animation:gridMove 20s linear infinite;
}

@keyframes gridMove{

    from{
        background-position:0 0;
    }

    to{
        background-position:0 38px;
    }

}

.halo{
    position:absolute;

    left:50%;
    top:44%;

    width:700px;
    height:700px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(95,70,255,.09),
            transparent 65%
        );

    filter:blur(6px);
}

/* =====================================================
   CORE
===================================================== */

.hud-core{
    position:absolute;

    left:50%;
    top:43%;

    width:360px;
    height:360px;

    transform:translate(-50%,-50%);

    opacity:.56;
}

.hud-ring{
    position:absolute;

    left:50%;
    top:50%;

    border-radius:50%;

    transform:translate(-50%,-50%);

    border:1px solid rgba(123,104,255,.25);
}

.r1{
    width:340px;
    height:340px;

    border-left-color:transparent;
    border-right-color:rgba(70,210,255,.38);

    animation:spin 18s linear infinite;
}

.r2{
    width:290px;
    height:290px;

    border-style:dashed;

    border-color:
        rgba(70,210,255,.25);

    animation:spinReverse 12s linear infinite;
}

.r3{
    width:240px;
    height:240px;

    border-top-color:
        rgba(160,130,255,.55);

    border-bottom-color:
        transparent;

    animation:spin 8s linear infinite;
}

.r4{
    width:190px;
    height:190px;

    border-color:
        rgba(80,180,255,.18);

    animation:pulse 3s ease-in-out infinite;
}

@keyframes spin{

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }

}

@keyframes spinReverse{

    to{
        transform:
            translate(-50%,-50%)
            rotate(-360deg);
    }

}

@keyframes pulse{

    0%,100%{
        transform:
            translate(-50%,-50%)
            scale(.92);

        opacity:.35;
    }

    50%{
        transform:
            translate(-50%,-50%)
            scale(1.08);

        opacity:.75;
    }

}

.core-light{
    position:absolute;

    left:50%;
    top:50%;

    width:72px;
    height:72px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            white,
            #bcaeff 12%,
            #7557ff 40%,
            #21184d 72%,
            transparent 100%
        );

    box-shadow:
        0 0 20px rgba(125,100,255,.9),
        0 0 70px rgba(85,100,255,.5);

    animation:corePulse 2.8s ease-in-out infinite;
}

@keyframes corePulse{

    0%,100%{
        transform:
            translate(-50%,-50%)
            scale(.86);
    }

    50%{
        transform:
            translate(-50%,-50%)
            scale(1.12);
    }

}

/* =====================================================
   SCANNERS
===================================================== */

.scan-line{
    position:absolute;

    left:-20%;

    width:140%;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(90,190,255,.4),
            transparent
        );

    animation:scan 6s linear infinite;
}

.scan1{
    top:30%;
}

.scan2{
    top:65%;
    animation-delay:2.5s;
}

@keyframes scan{

    0%{
        transform:translateX(-20%);
        opacity:0;
    }

    25%{
        opacity:.8;
    }

    75%{
        opacity:.8;
    }

    100%{
        transform:translateX(20%);
        opacity:0;
    }

}

/* =====================================================
   POINTS
===================================================== */

.hud-point{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#8e7cff;

    box-shadow:
        0 0 12px #7657ff;

    animation:pointPulse 2s infinite;
}

@keyframes pointPulse{

    0%,100%{
        opacity:.2;
        transform:scale(.6);
    }

    50%{
        opacity:1;
        transform:scale(1.5);
    }

}

/* =====================================================
   PARTICULES
===================================================== */

.particles{
    position:absolute;
    inset:0;
}

.particle{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#8b7cff;

    box-shadow:
        0 0 8px #7657ff;

    animation:
        particleMove
        var(--duration)
        linear
        infinite;
}

@keyframes particleMove{

    0%{
        transform:
            translateY(100vh)
            translateX(0);

        opacity:0;
    }

    20%{
        opacity:.6;
    }

    80%{
        opacity:.6;
    }

    100%{
        transform:
            translateY(-20vh)
            translateX(var(--move));

        opacity:0;
    }

}

/* =====================================================
   INTERFACE
===================================================== */

.interface{
    position:relative;

    z-index:5;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    height:72px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        calc(env(safe-area-inset-top) + 8px)
        14px
        8px;

    background:
        linear-gradient(
            180deg,
            rgba(3,4,10,.94),
            rgba(3,4,10,.55)
        );

    border-bottom:
        1px solid rgba(255,255,255,.07);

    backdrop-filter:blur(16px);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-icon{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #7657ff,
            #43bfff
        );

    box-shadow:
        0 0 25px rgba(100,80,255,.4);

    font-size:21px;
}

.brand-name{
    font-size:17px;
    font-weight:700;
}

.status{
    margin-top:2px;

    font-size:10px;
    letter-spacing:1px;

    color:#55e6a5;
}

.status.listening{
    color:#43d9ff;
}

.status.thinking{
    color:#a88cff;
}

.status.speaking{
    color:#55e6a5;
}

.status.error{
    color:#ff5364;
}

.clear{
    width:40px;
    height:40px;

    border-radius:12px;

    border:
        1px solid rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.05);

    color:white;

    cursor:pointer;
}

/* =====================================================
   CHAT
===================================================== */

.chat{
    flex:1;

    overflow-y:auto;

    padding:
        20px
        14px
        18px;

    -webkit-overflow-scrolling:touch;

    background:
        linear-gradient(
            180deg,
            rgba(3,4,10,.08),
            rgba(3,4,10,.58)
        );
}

.chat::-webkit-scrollbar{
    display:none;
}

/* =====================================================
   WELCOME
===================================================== */

.welcome{
    text-align:center;

    padding:
        28px 8px 20px;
}

.welcome h2{
    font-size:23px;

    margin-bottom:7px;

    text-shadow:
        0 0 25px rgba(118,87,255,.35);
}

.welcome p{
    color:rgba(255,255,255,.5);

    font-size:14px;
}

.suggestions{
    display:flex;

    gap:8px;

    overflow-x:auto;

    margin-top:18px;
}

.suggestions::-webkit-scrollbar{
    display:none;
}

.suggestion{
    flex-shrink:0;

    padding:
        10px 13px;

    border-radius:15px;

    border:
        1px solid rgba(255,255,255,.08);

    background:
        rgba(12,14,25,.65);

    color:white;

    cursor:pointer;
}

/* =====================================================
   MESSAGES
===================================================== */

.message{
    display:flex;

    margin-bottom:12px;
}

.message.user{
    justify-content:flex-end;
}

.message.ai{
    justify-content:flex-start;
}

.bubble{
    max-width:84%;

    padding:
        11px 14px;

    border-radius:17px;

    font-size:15px;
    line-height:1.45;

    white-space:pre-wrap;

    overflow-wrap:anywhere;

    backdrop-filter:blur(12px);
}

.user .bubble{
    background:
        linear-gradient(
            135deg,
            #7657ff,
            #5a42cf
        );

    border-bottom-right-radius:5px;

    box-shadow:
        0 0 20px rgba(118,87,255,.12);
}

.ai .bubble{
    background:
        rgba(13,15,25,.76);

    border:
        1px solid rgba(120,110,255,.12);

    border-bottom-left-radius:5px;
}

/* =====================================================
   TYPING
===================================================== */

.typing{
    display:none;

    align-items:center;

    gap:5px;

    padding:
        0 18px 8px;
}

.typing.active{
    display:flex;
}

.typing span{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#a88cff;

    animation:
        typing 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{

    0%,100%{
        transform:translateY(0);
        opacity:.3;
    }

    50%{
        transform:translateY(-4px);
        opacity:1;
    }

}

/* =====================================================
   INPUT
===================================================== */

.input-area{
    flex-shrink:0;

    display:flex;

    gap:9px;

    padding:
        9px
        12px
        calc(
            10px +
            env(safe-area-inset-bottom)
        );

    background:
        rgba(3,4,10,.9);

    border-top:
        1px solid rgba(255,255,255,.07);

    backdrop-filter:blur(20px);
}

.mic{
    width:50px;
    min-width:50px;

    height:50px;

    border-radius:50%;

    background:
        rgba(255,255,255,.06);

    border:
        1px solid rgba(255,255,255,.09);

    color:white;

    font-size:20px;

    transition:.2s;

    cursor:pointer;
}

.mic:active{
    transform:scale(.9);
}

.mic.listening{
    background:#43d9ff;

    color:#001219;

    box-shadow:
        0 0 35px rgba(67,217,255,.65);
}

.input-box{
    flex:1;

    min-height:50px;

    display:flex;
    align-items:flex-end;

    padding:
        5px
        5px
        5px
        14px;

    border-radius:25px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid rgba(255,255,255,.08);
}

textarea{
    flex:1;

    resize:none;

    max-height:110px;

    padding:
        8px 4px;

    background:transparent;

    border:0;
    outline:0;

    color:white;
}

textarea::placeholder{
    color:rgba(255,255,255,.4);
}

.send{
    width:40px;
    height:40px;

    border-radius:50%;

    border:0;

    background:#7657ff;

    color:white;

    font-size:17px;

    box-shadow:
        0 0 20px rgba(118,87,255,.3);

    cursor:pointer;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-height:700px){

    .hud-core{
        top:38%;

        transform:
            translate(-50%,-50%)
            scale(.78);
    }

    .welcome{
        padding-top:8px;
    }

}
</style>
</head>

<body>

<div class="app">

    <!-- =================================================
         HUD JARVIS
    ================================================== -->

    <div class="hud">

        <div class="hud-grid"></div>

        <div class="halo"></div>

        <div class="scan-line scan1"></div>

        <div class="scan-line scan2"></div>

        <div class="hud-core">

            <div class="hud-ring r1"></div>

            <div class="hud-ring r2"></div>

            <div class="hud-ring r3"></div>

            <div class="hud-ring r4"></div>

            <div class="core-light"></div>

        </div>

        <div
            class="hud-point"
            style="left:18%;top:29%;"
        ></div>

        <div
            class="hud-point"
            style="left:79%;top:23%;animation-delay:.5s"
        ></div>

        <div
            class="hud-point"
            style="left:11%;top:70%;animation-delay:1s"
        ></div>

        <div
            class="hud-point"
            style="left:86%;top:72%;animation-delay:1.5s"
        ></div>

        <div
            id="particles"
            class="particles"
        ></div>

    </div>


    <!-- =================================================
         INTERFACE
    ================================================== -->

    <div class="interface">

        <header class="header">

            <div class="brand">

                <div class="brand-icon">
                    ✦
                </div>

                <div>

                    <div class="brand-name">
                        Asdrick AI
                    </div>

                    <div
                        id="status"
                        class="status"
                    >
                        ● EN LIGNE
                    </div>

                </div>

            </div>

            <button
                id="clear"
                class="clear"
                type="button"
            >
                🗑️
            </button>

        </header>


        <!-- =================================================
             CHAT
        ================================================== -->

        <main
            id="chat"
            class="chat"
        >

            <section
                id="welcome"
                class="welcome"
            >

                <h2>
                    Asdrick AI
                </h2>

                <p>
                    Ton assistant personnel est prêt.
                </p>

                <div class="suggestions">

                    <button
                        class="suggestion"
                        data-command="Bonjour Asdrick AI !"
                    >
                        👋 Bonjour
                    </button>

                    <button
                        class="suggestion"
                        data-command="Dis-moi quelque chose d'intéressant."
                    >
                        🧠 Surprends-moi
                    </button>

                    <button
                        class="suggestion"
                        data-command="Ouvre YouTube"
                    >
                        ▶️ YouTube
                    </button>

                </div>

            </section>

        </main>


        <div
            id="typing"
            class="typing"
        >
            <span></span>
            <span></span>
            <span></span>
        </div>


        <!-- =================================================
             INPUT
        ================================================== -->

        <footer class="input-area">

            <button
                id="mic"
                class="mic"
                type="button"
            >
                🎙️
            </button>

            <div class="input-box">

                <textarea
                    id="input"
                    rows="1"
                    placeholder="Écris ou parle..."
                ></textarea>

                <button
                    id="send"
                    class="send"
                    type="button"
                >
                    ➤
                </button>

            </div>

        </footer>

    </div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
    "https://asdrick-ia.onrender.com";


/* =====================================================
   RACCOURCIS IPHONE
=====================================================

   IMPORTANT :

   Les raccourcis doivent être installés sur
   l'iPhone avec les noms EXACTS ci-dessous.

===================================================== */

const SHORTCUTS = {

    open_youtube:
        "Asdrick YouTube",

    open_tiktok:
        "Asdrick TikTok",

    open_messages:
        "Asdrick Messages",

    open_amazon:
        "Asdrick Amazon",

    open_netflix:
        "Asdrick Netflix",

    open_revolut:
        "Asdrick Revolut",

    open_timer:
        "Asdrick Minuteur",

    open_alarm:
        "Asdrick Alarme"

};


/* =====================================================
   ELEMENTS
===================================================== */

const chat =
    document.getElementById(
        "chat"
    );

const welcome =
    document.getElementById(
        "welcome"
    );

const input =
    document.getElementById(
        "input"
    );

const send =
    document.getElementById(
        "send"
    );

const mic =
    document.getElementById(
        "mic"
    );

const clear =
    document.getElementById(
        "clear"
    );

const typing =
    document.getElementById(
        "typing"
    );

const status =
    document.getElementById(
        "status"
    );

let recognition = null;

let listening = false;

let sending = false;


/* =====================================================
   PARTICULES
===================================================== */

function createParticles(){

    const container =
        document.getElementById(
            "particles"
        );

    for(
        let i = 0;
        i < 35;
        i++
    ){

        const p =
            document.createElement(
                "div"
            );

        p.className =
            "particle";

        p.style.left =
            Math.random() * 100 +
            "%";

        p.style.setProperty(
            "--move",
            (
                Math.random() * 180 -
                90
            ) + "px"
        );

        p.style.setProperty(
            "--duration",
            (
                6 +
                Math.random() * 10
            ) + "s"
        );

        p.style.animationDelay =
            (
                Math.random() * -12
            ) + "s";

        container.appendChild(
            p
        );

    }

}


/* =====================================================
   ÉTAT
===================================================== */

function setState(state){

    status.className =
        "status";


    if(state === "listening"){

        status.textContent =
            "● JE T'ÉCOUTE";

        status.classList.add(
            "listening"
        );

    }

    else if(state === "thinking"){

        status.textContent =
            "● ANALYSE...";

        status.classList.add(
            "thinking"
        );

    }

    else if(state === "speaking"){

        status.textContent =
            "● ASDRICK AI PARLE";

        status.classList.add(
            "speaking"
        );

    }

    else{

        status.textContent =
            "● EN LIGNE";

    }

}


/* =====================================================
   HISTORIQUE
===================================================== */

function getHistory(){

    try{

        const data =
            localStorage.getItem(
                "asdrick_history"
            );

        if(!data)
            return [];

        const parsed =
            JSON.parse(data);

        return Array.isArray(parsed)
            ? parsed
            : [];

    }
    catch{

        return [];

    }

}


function saveMessage(
    type,
    text
){

    const history =
        getHistory();

    history.push({

        type,

        text,

        date:
            Date.now()

    });

    localStorage.setItem(
        "asdrick_history",
        JSON.stringify(
            history.slice(-50)
        )
    );

}


/* =====================================================
   AFFICHER MESSAGE
===================================================== */

function addMessage(
    type,
    text
){

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message " + type;

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";

    bubble.textContent =
        String(text);

    row.appendChild(
        bubble
    );

    chat.appendChild(
        row
    );

    chat.scrollTop =
        chat.scrollHeight;

}


/* =====================================================
   CHARGER HISTORIQUE
===================================================== */

function loadHistory(){

    const history =
        getHistory();

    if(!history.length)
        return;

    welcome.style.display =
        "none";

    history.forEach(
        item => {

            if(
                item.type === "user" ||
                item.type === "ai"
            ){

                addMessage(
                    item.type,
                    item.text
                );

            }

        }
    );

}


/* =====================================================
   EXÉCUTER UNE ACTION
===================================================== */

function executeAction(
    action,
    url
){

    /* ---------------------------------------------
       SITE INTERNET
    --------------------------------------------- */

    if(
        action ===
        "open_website"
    ){

        if(url){

            window.location.href =
                url;

        }

        return;

    }


    /* ---------------------------------------------
       RACCOURCI IPHONE
    --------------------------------------------- */

    const shortcut =
        SHORTCUTS[action];


    if(!shortcut){

        console.warn(
            "Raccourci inconnu :",
            action
        );

        return;

    }


    /*
       Lancement direct du raccourci.

       Le raccourci doit être installé
       sur l'iPhone.
    */

    const shortcutURL =
        "shortcuts://run-shortcut?name=" +
        encodeURIComponent(
            shortcut
        );


    window.location.href =
        shortcutURL;

}


/* =====================================================
   ENVOYER MESSAGE
===================================================== */

async function sendMessage(){

    if(sending)
        return;


    const message =
        input.value.trim();


    if(!message)
        return;


    sending = true;


    input.value =
        "";


    welcome.style.display =
        "none";


    addMessage(
        "user",
        message
    );


    saveMessage(
        "user",
        message
    );


    setState(
        "thinking"
    );


    typing.classList.add(
        "active"
    );


    try{

        const allHistory =
            getHistory();


        const history =
            allHistory

                .slice(
                    0,
                    -1
                )

                .slice(
                    -20
                )

                .map(
                    item => ({

                        role:
                            item.type === "user"
                                ? "user"
                                : "assistant",

                        content:
                            item.text

                    })
                );


        const response =
            await fetch(
                API_URL +
                "/api/chat",
                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message,

                            history

                        })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Erreur serveur"
            );

        }


        typing.classList.remove(
            "active"
        );


        const reply =
            data.reply ||
            "Je n'ai pas réussi à répondre.";


        addMessage(
            "ai",
            reply
        );


        saveMessage(
            "ai",
            reply
        );


        /*
           Exécuter l'action APRÈS
           avoir affiché la réponse.
        */

        if(data.action){

            setTimeout(
                () => {

                    executeAction(
                        data.action,
                        data.url
                    );

                },
                350
            );

        }


        /*
           Vocal uniquement si aucune
           action n'est en train d'ouvrir
           une application.
        */

        if(!data.action){

            speak(
                reply
            );

        }

        else{

            setState(
                null
            );

        }

    }
    catch(error){

        console.error(
            "Erreur Asdrick AI :",
            error
        );


        typing.classList.remove(
            "active"
        );


        addMessage(
            "ai",
            "❌ Impossible de contacter le serveur Asdrick AI."
        );


        setState(
            null
        );

    }
    finally{

        sending =
            false;

    }

}


/* =====================================================
   VOIX
===================================================== */

function speak(text){

    if(
        !(
            "speechSynthesis"
            in window
        )
    ){

        return;

    }


    speechSynthesis.cancel();


    const clean =
        String(text)

            .replace(
                /[\u{1F300}-\u{1FAFF}]/gu,
                ""
            )

            .replace(
                /[*_`#]/g,
                ""
            )

            .replace(
                /\s+/g,
                " "
            )

            .trim();


    if(!clean)
        return;


    const utterance =
        new SpeechSynthesisUtterance(
            clean
        );


    utterance.lang =
        "fr-FR";


    utterance.rate =
        .96;


    utterance.pitch =
        1;


    utterance.onstart =
        () => {

            setState(
                "speaking"
            );

        };


    utterance.onend =
        () => {

            setState(
                null
            );

        };


    utterance.onerror =
        () => {

            setState(
                null
            );

        };


    const voices =
        speechSynthesis.getVoices();


    const french =
        voices.find(
            voice =>

                voice.lang &&
                voice.lang
                    .toLowerCase()
                    .startsWith("fr")
        );


    if(french){

        utterance.voice =
            french;

    }


    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   MICRO
===================================================== */

function setupRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        mic.disabled =
            true;

        mic.style.opacity =
            ".4";

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "fr-FR";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        () => {

            listening =
                true;


            mic.classList.add(
                "listening"
            );


            setState(
                "listening"
            );

        };


    recognition.onresult =
        event => {

            const result =
                event
                    .results[0][0]
                    .transcript
                    .trim();


            if(result){

                input.value =
                    result;


                sendMessage();

            }

        };


    recognition.onerror =
        error => {

            console.error(
                "Micro :",
                error
            );


            stopRecognition();

        };


    recognition.onend =
        () => {

            stopRecognition();

        };

}


function stopRecognition(){

    listening =
        false;


    mic.classList.remove(
        "listening"
    );


    if(!sending){

        setState(
            null
        );

    }

}


/* =====================================================
   MICRO CLICK
===================================================== */

mic.addEventListener(
    "click",
    () => {

        if(!recognition)
            return;


        if(listening){

            recognition.stop();

        }

        else{

            if(
                "speechSynthesis"
                in window
            ){

                speechSynthesis.cancel();

            }


            try{

                recognition.start();

            }
            catch(error){

                console.error(
                    error
                );

            }

        }

    }
);


/* =====================================================
   ENTER
===================================================== */

input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   BOUTON ENVOYER
===================================================== */

send.addEventListener(
    "click",
    sendMessage
);


/* =====================================================
   SUGGESTIONS
===================================================== */

document
    .querySelectorAll(
        ".suggestion"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    input.value =
                        button.dataset.command;

                    sendMessage();

                }
            );

        }
    );


/* =====================================================
   EFFACER
===================================================== */

clear.addEventListener(
    "click",
    () => {

        localStorage.removeItem(
            "asdrick_history"
        );


        chat
            .querySelectorAll(
                ".message"
            )
            .forEach(
                element =>
                    element.remove()
            );


        welcome.style.display =
            "block";


        if(
            "speechSynthesis"
            in window
        ){

            speechSynthesis.cancel();

        }


        setState(
            null
        );

    }
);


/* =====================================================
   INIT
===================================================== */

createParticles();

loadHistory();

setupRecognition();

</script>
