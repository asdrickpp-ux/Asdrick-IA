<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#08080c"
>

<title>Asdrick AI</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {

    --bg: #08080c;
    --panel: #121218;
    --panel2: #1a1a22;

    --text: #ffffff;
    --muted: #92929d;

    --border:
        rgba(255,255,255,0.08);

    --accent: #7657ff;

    --green: #55df91;

    --red: #ff5757;
}


html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background:
        var(--bg);

    color:
        var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
}


button,
textarea {

    font: inherit;

}


button {

    border: 0;

    -webkit-tap-highlight-color:
        transparent;

}


.app {

    width: 100%;
    height: 100dvh;

    display: flex;

    flex-direction: column;

    background:

        radial-gradient(
            circle at 50% -20%,
            rgba(118,87,255,0.2),
            transparent 45%
        ),

        var(--bg);
}


/* =====================================================
   HEADER
===================================================== */

.topbar {

    min-height: 72px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        calc(env(safe-area-inset-top) + 10px)
        15px
        10px;

    border-bottom:
        1px solid var(--border);

    background:
        rgba(8,8,12,0.9);

    backdrop-filter:
        blur(20px);

}


.brand {

    display: flex;

    align-items: center;

    gap: 11px;

}


.logo {

    width: 43px;
    height: 43px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #7657ff,
            #b08cff
        );

    font-size: 23px;

    box-shadow:
        0 0 30px
        rgba(118,87,255,0.3);

}


.brand h1 {

    font-size: 17px;

}


.status {

    display: block;

    margin-top: 2px;

    color:
        var(--green);

    font-size: 11px;

}


.status.thinking {

    color:
        #b08cff;

}


.status.error {

    color:
        var(--red);

}


.clear {

    width: 40px;
    height: 40px;

    border-radius: 12px;

    background:
        var(--panel2);

    color:
        white;

    border:
        1px solid var(--border);

}


/* =====================================================
   CHAT
===================================================== */

.chat {

    flex: 1;

    overflow-y: auto;

    padding:
        25px 14px 20px;

    -webkit-overflow-scrolling:
        touch;

}


.chat::-webkit-scrollbar {

    display: none;

}


/* =====================================================
   WELCOME
===================================================== */

.welcome {

    text-align: center;

    max-width: 520px;

    margin:
        8vh auto 0;

}


.big-logo {

    width: 75px;
    height: 75px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin:
        0 auto 20px;

    border-radius: 24px;

    background:
        linear-gradient(
            135deg,
            #7657ff,
            #b08cff
        );

    font-size: 38px;

    box-shadow:
        0 0 40px
        rgba(118,87,255,0.3);

}


.welcome h2 {

    font-size: 27px;

    margin-bottom: 8px;

}


.welcome p {

    color:
        var(--muted);

}


.suggestions {

    display: grid;

    gap: 10px;

    margin-top: 25px;

}


.suggestion {

    padding:
        14px 16px;

    border-radius: 16px;

    background:
        var(--panel);

    color:
        white;

    border:
        1px solid var(--border);

    text-align:
        left;

}


/* =====================================================
   MESSAGES
===================================================== */

.message {

    display: flex;

    margin-bottom: 14px;

}


.message.user {

    justify-content:
        flex-end;

}


.message.ai {

    justify-content:
        flex-start;

}


.bubble {

    max-width:
        84%;

    padding:
        12px 15px;

    border-radius:
        18px;

    line-height:
        1.45;

    font-size:
        15px;

    white-space:
        pre-wrap;

    overflow-wrap:
        anywhere;

}


.user .bubble {

    background:
        var(--accent);

    border-bottom-right-radius:
        6px;

}


.ai .bubble {

    background:
        var(--panel2);

    border:
        1px solid var(--border);

    border-bottom-left-radius:
        6px;

}


/* =====================================================
   TYPING
===================================================== */

.typing {

    display: none;

    gap: 5px;

    padding:
        0 20px 10px;

}


.typing.active {

    display: flex;

}


.typing span {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #aaa;

    animation:
        typing 1s infinite;

}


.typing span:nth-child(2) {

    animation-delay:
        0.15s;

}


.typing span:nth-child(3) {

    animation-delay:
        0.3s;

}


@keyframes typing {

    0%,
    60%,
    100% {

        opacity:
            0.25;

        transform:
            translateY(0);

    }

    30% {

        opacity:
            1;

        transform:
            translateY(-4px);

    }

}


/* =====================================================
   INPUT
===================================================== */

.input-area {

    display: flex;

    gap: 9px;

    padding:
        10px
        13px
        calc(
            12px +
            env(safe-area-inset-bottom)
        );

    border-top:
        1px solid var(--border);

    background:
        rgba(8,8,12,0.94);

    backdrop-filter:
        blur(20px);

}


.mic {

    width: 49px;
    min-width: 49px;

    height: 49px;

    border-radius: 50%;

    background:
        var(--panel2);

    color:
        white;

    border:
        1px solid var(--border);

    font-size: 20px;

}


.mic.listening {

    background:
        #d84747;

}


.input-box {

    flex: 1;

    min-height:
        49px;

    display: flex;

    align-items:
        flex-end;

    padding:
        5px 6px 5px 14px;

    border-radius:
        25px;

    background:
        var(--panel);

    border:
        1px solid var(--border);

}


textarea {

    flex: 1;

    resize: none;

    max-height:
        110px;

    padding:
        8px 4px;

    outline: none;

    border: 0;

    background:
        transparent;

    color:
        white;

}


.send {

    width: 39px;
    height: 39px;

    border-radius: 50%;

    background:
        var(--accent);

    color:
        white;

    font-size: 17px;

}

</style>

</head>


<body>


<div class="app">


<header class="topbar">

    <div class="brand">

        <div class="logo">
            ✦
        </div>

        <div>

            <h1>
                Asdrick AI
            </h1>

            <span
                id="status"
                class="status"
            >
                ● En ligne
            </span>

        </div>

    </div>


    <button
        id="clear"
        class="clear"
        type="button"
    >
        🗑️
    </button>

</header>


<main
    id="chat"
    class="chat"
>


<section
    id="welcome"
    class="welcome"
>

    <div class="big-logo">
        ✦
    </div>


    <h2>
        Salut Asdrick 👋
    </h2>


    <p>
        Ton assistant personnel.
    </p>


    <div class="suggestions">

        <button
            class="suggestion"
            data-command="Bonjour !"
        >
            👋 Dis bonjour
        </button>


        <button
            class="suggestion"
            data-command="Explique-moi quelque chose d'intéressant."
        >
            🧠 Apprends-moi quelque chose
        </button>


        <button
            class="suggestion"
            data-command="Ouvre YouTube"
        >
            ▶️ Ouvre YouTube
        </button>

    </div>

</section>


</main>


<div
    id="typing"
    class="typing"
>

    <span></span>
    <span></span>
    <span></span>

</div>


<footer class="input-area">


<button
    id="mic"
    class="mic"
    type="button"
>
    🎙️
</button>


<div class="input-box">

<textarea
    id="input"
    rows="1"
    placeholder="Écris un message..."
></textarea>


<button
    id="send"
    class="send"
    type="button"
>
    ➤
</button>

</div>


</footer>


</div>


<script>

"use strict";


/* =====================================================
   CONFIGURATION
===================================================== */

const API_URL =
    "https://asdrick-ia.onrender.com";


/*
 * Noms EXACTS des raccourcis installés
 * sur ton iPhone.
 */

const SHORTCUTS = {

    open_youtube:
        "Asdrick YouTube",

    open_tiktok:
        "Asdrick TikTok",

    open_messages:
        "Asdrick Messages",

    open_amazon:
        "Asdrick Amazon",

    open_netflix:
        "Asdrick Netflix",

    open_revolut:
        "Asdrick Revolut"

};


/* =====================================================
   ELEMENTS
===================================================== */

const chat =
    document.getElementById(
        "chat"
    );

const welcome =
    document.getElementById(
        "welcome"
    );

const input =
    document.getElementById(
        "input"
    );

const send =
    document.getElementById(
        "send"
    );

const mic =
    document.getElementById(
        "mic"
    );

const clear =
    document.getElementById(
        "clear"
    );

const typing =
    document.getElementById(
        "typing"
    );

const status =
    document.getElementById(
        "status"
    );


let sending =
    false;

let recognition =
    null;

let listening =
    false;


/* =====================================================
   HISTORIQUE
===================================================== */

function getHistory() {

    try {

        const data =
            localStorage.getItem(
                "asdrick_history"
            );

        if (!data) {
            return [];
        }

        const parsed =
            JSON.parse(data);

        return Array.isArray(parsed)
            ? parsed
            : [];

    } catch {

        return [];

    }

}


function saveMessage(
    type,
    text
) {

    try {

        const history =
            getHistory();


        history.push({

            type,
            text,
            date:
                Date.now()

        });


        localStorage.setItem(

            "asdrick_history",

            JSON.stringify(
                history.slice(-50)
            )

        );

    } catch (error) {

        console.error(
            "Mémoire :",
            error
        );

    }

}


/* =====================================================
   CHARGER HISTORIQUE
===================================================== */

function loadHistory() {

    const history =
        getHistory();


    if (
        history.length === 0
    ) {

        return;

    }


    welcome.style.display =
        "none";


    history.forEach(
        item => {

            if (
                !item ||
                (
                    item.type !== "user" &&
                    item.type !== "ai"
                )
            ) {

                return;

            }


            addMessage(
                item.type,
                item.text
            );

        }
    );

}


/* =====================================================
   AFFICHAGE
===================================================== */

function addMessage(
    type,
    text
) {

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message " +
        type;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.textContent =
        String(text);


    row.appendChild(
        bubble
    );


    chat.appendChild(
        row
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* =====================================================
   ENVOYER MESSAGE
===================================================== */

async function sendMessage() {

    if (sending) {
        return;
    }


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    sending =
        true;


    input.value =
        "";


    welcome.style.display =
        "none";


    addMessage(
        "user",
        message
    );


    /*
     * L'historique est récupéré
     * AVANT de sauvegarder le message actuel.
     */

    const oldHistory =
        getHistory();


    const history =
        oldHistory
            .filter(item => {

                return (

                    item &&

                    (
                        item.type === "user" ||
                        item.type === "ai"
                    ) &&

                    typeof item.text === "string"

                );

            })
            .slice(-20)
            .map(item => {

                return {

                    role:
                        item.type === "user"
                            ? "user"
                            : "assistant",

                    content:
                        item.text

                };

            });


    saveMessage(
        "user",
        message
    );


    setThinking(
        true
    );


    try {

        const response =
            await fetch(
                API_URL +
                "/api/chat",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message,

                            history

                        })

                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (
            !data ||
            typeof data.reply !== "string"
        ) {

            throw new Error(
                "Réponse invalide."
            );

        }


        addMessage(
            "ai",
            data.reply
        );


        saveMessage(
            "ai",
            data.reply
        );


        /*
         * Exécution de l'action
         */

        if (data.action) {

            executeAction(
                data.action
            );

        }


        speak(
            data.reply
        );


    } catch (error) {

        console.error(
            "❌ API :",
            error
        );


        addMessage(
            "ai",
            "❌ Je n'arrive pas à contacter mon serveur."
        );


        status.textContent =
            "● Erreur serveur";


        status.className =
            "status error";

    } finally {

        sending =
            false;


        setThinking(
            false
        );

    }

}


/* =====================================================
   ACTIONS IPHONE
===================================================== */

function executeAction(
    action
) {

    const shortcutName =
        SHORTCUTS[action];


    if (!shortcutName) {

        console.warn(
            "Action inconnue :",
            action
        );

        return;

    }


    /*
     * Lancement du raccourci Apple.
     */

    const url =
        "shortcuts://run-shortcut?name=" +
        encodeURIComponent(
            shortcutName
        );


    console.log(
        "📱 Lancement :",
        shortcutName
    );


    window.location.href =
        url;

}


/* =====================================================
   ENVOI
===================================================== */

send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   SUGGESTIONS
===================================================== */

document
    .querySelectorAll(
        "[data-command]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    input.value =
                        button.dataset.command;

                    sendMessage();

                }
            );

        }
    );


/* =====================================================
   THINKING
===================================================== */

function setThinking(
    active
) {

    if (active) {

        typing.classList.add(
            "active"
        );


        status.textContent =
            "● Réflexion...";


        status.className =
            "status thinking";

    } else {

        typing.classList.remove(
            "active"
        );


        status.textContent =
            "● En ligne";


        status.className =
            "status";

    }

}


/* =====================================================
   VOIX
===================================================== */

function speak(
    text
) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    try {

        speechSynthesis.cancel();


        const voice =
            new SpeechSynthesisUtterance(
                text
            );


        voice.lang =
            "fr-FR";


        voice.rate =
            1;


        speechSynthesis.speak(
            voice
        );

    } catch (error) {

        console.error(
            "Voix :",
            error
        );

    }

}


/* =====================================================
   MICRO
===================================================== */

function setupVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        mic.disabled =
            true;

        mic.style.opacity =
            "0.4";

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "fr-FR";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        () => {

            listening =
                true;

            mic.classList.add(
                "listening"
            );

            status.textContent =
                "● J'écoute...";

        };


    recognition.onresult =
        event => {

            try {

                const result =
                    event
                        .results[0][0]
                        .transcript;


                input.value =
                    result;


                stopListening();


                sendMessage();

            } catch (error) {

                console.error(
                    "Micro :",
                    error
                );

            }

        };


    recognition.onerror =
        error => {

            console.error(
                "Micro :",
                error
            );

            stopListening();

        };


    recognition.onend =
        () => {

            stopListening();

        };

}


function startListening() {

    if (
        !recognition ||
        listening
    ) {

        return;

    }


    try {

        recognition.start();

    } catch (error) {

        console.error(
            "Micro :",
            error
        );

    }

}


function stopListening() {

    listening =
        false;


    mic.classList.remove(
        "listening"
    );


    status.textContent =
        "● En ligne";

}


mic.addEventListener(
    "click",
    () => {

        if (!recognition) {

            addMessage(
                "ai",
                "🎙️ La reconnaissance vocale n'est pas disponible."
            );

            return;

        }


        if (listening) {

            try {

                recognition.stop();

            } catch {}

        } else {

            startListening();

        }

    }
);


/* =====================================================
   EFFACER
===================================================== */

clear.addEventListener(
    "click",
    () => {

        localStorage.removeItem(
            "asdrick_history"
        );


        chat
            .querySelectorAll(
                ".message"
            )
            .forEach(
                element =>
                    element.remove()
            );


        welcome.style.display =
            "block";

    }
);


/* =====================================================
   START
===================================================== */

loadHistory();

setupVoice();

</script>


</body>

</html>
