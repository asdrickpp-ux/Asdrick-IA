<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#05060a">

<title>Asdrick AI</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #05060a;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
}


/* =====================================================
   VARIABLES
===================================================== */

:root {

    --purple: #7657ff;
    --purple-light: #a88cff;

    --blue: #4f8cff;

    --cyan: #43d9ff;

    --green: #55e6a5;

    --red: #ff5364;

    --panel:
        rgba(16,17,26,0.78);

    --border:
        rgba(255,255,255,0.09);

}


/* =====================================================
   APP
===================================================== */

.app {

    width: 100%;
    height: 100dvh;

    display: flex;
    flex-direction: column;

    background:

        radial-gradient(
            circle at 50% 5%,
            rgba(118,87,255,0.18),
            transparent 35%
        ),

        radial-gradient(
            circle at 50% 45%,
            rgba(67,217,255,0.06),
            transparent 40%
        ),

        #05060a;

}


/* =====================================================
   HEADER
===================================================== */

.header {

    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding:
        calc(env(safe-area-inset-top) + 8px)
        16px
        8px;

    border-bottom:
        1px solid var(--border);

    background:
        rgba(5,6,10,0.78);

    backdrop-filter:
        blur(20px);

    z-index: 20;

}


.brand {

    display: flex;
    align-items: center;
    gap: 10px;

}


.brand-icon {

    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--purple-light)
        );

    box-shadow:
        0 0 25px
        rgba(118,87,255,0.35);

    font-size: 21px;

}


.brand-name {

    font-weight: 700;
    font-size: 17px;

}


.status {

    margin-top: 2px;

    color: var(--green);

    font-size: 11px;

}


.status.thinking {
    color: var(--purple-light);
}

.status.listening {
    color: var(--cyan);
}

.status.speaking {
    color: var(--green);
}

.status.error {
    color: var(--red);
}


.clear {

    width: 40px;
    height: 40px;

    border-radius: 12px;

    background:
        rgba(255,255,255,0.06);

    border:
        1px solid var(--border);

    color: white;

    font-size: 17px;

}


/* =====================================================
   CORE AREA
===================================================== */

.core-area {

    position: relative;

    height: 43%;

    min-height: 300px;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

}


/* =====================================================
   HUD GRID
===================================================== */

.grid {

    position: absolute;

    width: 430px;
    height: 430px;

    opacity: 0.16;

    background:

        linear-gradient(
            rgba(118,87,255,0.15) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(118,87,255,0.15) 1px,
            transparent 1px
        );

    background-size:
        28px 28px;

    mask-image:
        radial-gradient(
            circle,
            black 15%,
            transparent 70%
        );

    animation:
        gridMove 12s linear infinite;

}


@keyframes gridMove {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* =====================================================
   CORE
===================================================== */

.core {

    position: relative;

    width: 210px;
    height: 210px;

    display: flex;

    align-items: center;
    justify-content: center;

}


/* =====================================================
   OUTER RINGS
===================================================== */

.ring {

    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        rgba(118,87,255,0.35);

}


.ring.one {

    width: 205px;
    height: 205px;

    animation:
        rotate 16s linear infinite;

}


.ring.two {

    width: 178px;
    height: 178px;

    border-style: dashed;

    border-color:
        rgba(67,217,255,0.35);

    animation:
        rotateReverse 11s linear infinite;

}


.ring.three {

    width: 150px;
    height: 150px;

    border-color:
        rgba(168,140,255,0.42);

    animation:
        pulseRing 3s ease-in-out infinite;

}


@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


@keyframes rotateReverse {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }

}


@keyframes pulseRing {

    0%,
    100% {
        transform: scale(0.96);
        opacity: 0.45;
    }

    50% {
        transform: scale(1.05);
        opacity: 0.9;
    }

}


/* =====================================================
   CORE GLOW
===================================================== */

.core-glow {

    position: absolute;

    width: 120px;
    height: 120px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(168,140,255,0.9),
            rgba(118,87,255,0.35) 40%,
            transparent 72%
        );

    filter:
        blur(8px);

    animation:
        coreBreath 3s ease-in-out infinite;

}


@keyframes coreBreath {

    0%,
    100% {
        transform: scale(0.88);
        opacity: 0.65;
    }

    50% {
        transform: scale(1.12);
        opacity: 1;
    }

}


/* =====================================================
   CORE BALL
===================================================== */

.core-ball {

    position: relative;

    width: 75px;
    height: 75px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:

        radial-gradient(
            circle at 35% 30%,
            #ffffff,
            #b9a9ff 12%,
            #7657ff 40%,
            #241c55 70%,
            #080811 100%
        );

    box-shadow:

        0 0 20px
        rgba(118,87,255,0.9),

        0 0 55px
        rgba(118,87,255,0.55),

        inset 0 0 20px
        rgba(255,255,255,0.3);

    z-index: 5;

}


.core-ball::before {

    content: "";

    position: absolute;

    width: 34px;
    height: 34px;

    border-radius: 50%;

    border:
        2px solid
        rgba(255,255,255,0.7);

    animation:
        innerPulse 2s ease-in-out infinite;

}


@keyframes innerPulse {

    0%,
    100% {
        transform: scale(0.75);
        opacity: 0.4;
    }

    50% {
        transform: scale(1.1);
        opacity: 0.9;
    }

}


.core-symbol {

    position: relative;

    z-index: 10;

    font-size: 25px;

    text-shadow:
        0 0 12px white;

}


/* =====================================================
   LISTENING MODE
===================================================== */

.core.listening
.core-ball {

    background:
        radial-gradient(
            circle at 35% 30%,
            white,
            #8eeaff 18%,
            #43d9ff 45%,
            #154e68 75%,
            #050b11
        );

    box-shadow:

        0 0 25px
        rgba(67,217,255,0.9),

        0 0 70px
        rgba(67,217,255,0.55);

}


.core.listening .ring {

    border-color:
        rgba(67,217,255,0.7);

}


.core.listening .core-glow {

    background:
        radial-gradient(
            circle,
            rgba(67,217,255,0.95),
            rgba(67,217,255,0.35),
            transparent 70%
        );

}


/* =====================================================
   SPEAKING MODE
===================================================== */

.core.speaking .core-ball {

    animation:
        speakingPulse 0.65s ease-in-out infinite;

}


.core.speaking .ring {

    animation-duration:
        3s;

}


@keyframes speakingPulse {

    0%,
    100% {
        transform: scale(0.92);
    }

    50% {
        transform: scale(1.1);
    }

}


/* =====================================================
   THINKING MODE
===================================================== */

.core.thinking .ring.one {

    animation-duration:
        4s;

}


.core.thinking .core-glow {

    animation-duration:
        1.2s;

}


/* =====================================================
   AUDIO BARS
===================================================== */

.audio-bars {

    position: absolute;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 4px;

    width: 250px;
    height: 90px;

}


.audio-bar {

    width: 3px;

    height: 20px;

    border-radius: 4px;

    background:
        linear-gradient(
            to top,
            var(--purple),
            var(--cyan)
        );

    opacity: 0.7;

    transform:
        scaleY(0.35);

}


.core.listening .audio-bar,
.core.speaking .audio-bar {

    animation:
        audioPulse
        var(--delay)
        ease-in-out
        infinite alternate;

}


@keyframes audioPulse {

    from {
        transform: scaleY(0.25);
    }

    to {
        transform: scaleY(var(--height));
    }

}


/* =====================================================
   CORE LABEL
===================================================== */

.core-label {

    position: absolute;

    bottom: 15px;

    left: 0;
    right: 0;

    text-align: center;

    font-size: 10px;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,0.5);

}


/* =====================================================
   CHAT
===================================================== */

.chat {

    flex: 1;

    overflow-y: auto;

    padding:
        12px
        14px
        20px;

    -webkit-overflow-scrolling:
        touch;

}


.chat::-webkit-scrollbar {
    display: none;
}


/* =====================================================
   WELCOME
===================================================== */

.welcome {

    text-align: center;

    padding:
        5px 10px 20px;

}


.welcome h2 {

    font-size: 22px;

    margin-bottom: 6px;

}


.welcome p {

    color:
        rgba(255,255,255,0.5);

    font-size: 14px;

}


.suggestions {

    display: flex;

    gap: 8px;

    overflow-x: auto;

    margin-top: 16px;

    padding-bottom: 4px;

}


.suggestions::-webkit-scrollbar {
    display: none;
}


.suggestion {

    flex-shrink: 0;

    padding:
        10px 13px;

    border-radius: 15px;

    background:
        rgba(255,255,255,0.055);

    border:
        1px solid var(--border);

    color: white;

}


/* =====================================================
   MESSAGES
===================================================== */

.message {

    display: flex;

    margin-bottom: 12px;

}


.message.user {
    justify-content: flex-end;
}


.message.ai {
    justify-content: flex-start;
}


.bubble {

    max-width: 84%;

    padding:
        11px 14px;

    border-radius: 17px;

    line-height: 1.45;

    font-size: 15px;

    white-space: pre-wrap;

    overflow-wrap: anywhere;

}


.user .bubble {

    background:
        linear-gradient(
            135deg,
            var(--purple),
            #6045dc
        );

    border-bottom-right-radius:
        5px;

}


.ai .bubble {

    background:
        rgba(255,255,255,0.065);

    border:
        1px solid var(--border);

    border-bottom-left-radius:
        5px;

}


/* =====================================================
   TYPING
===================================================== */

.typing {

    display: none;

    align-items: center;

    gap: 5px;

    padding:
        0 18px 7px;

}


.typing.active {
    display: flex;
}


.typing span {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background:
        var(--purple-light);

    animation:
        typing 1s infinite;

}


.typing span:nth-child(2) {
    animation-delay: .15s;
}


.typing span:nth-child(3) {
    animation-delay: .3s;
}


@keyframes typing {

    0%,
    100% {
        transform: translateY(0);
        opacity: .3;
    }

    50% {
        transform: translateY(-4px);
        opacity: 1;
    }

}


/* =====================================================
   INPUT
===================================================== */

.input-area {

    display: flex;

    gap: 9px;

    padding:
        9px
        12px
        calc(
            10px +
            env(safe-area-inset-bottom)
        );

    border-top:
        1px solid var(--border);

    background:
        rgba(5,6,10,0.9);

    backdrop-filter:
        blur(20px);

}


.mic {

    width: 50px;
    min-width: 50px;

    height: 50px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.06);

    border:
        1px solid var(--border);

    color: white;

    font-size: 21px;

    transition:
        transform .15s,
        background .2s;

}


.mic:active {

    transform:
        scale(.9);

}


.mic.listening {

    background:
        var(--cyan);

    color:
        #001219;

    box-shadow:
        0 0 30px
        rgba(67,217,255,0.6);

}


.input-box {

    flex: 1;

    min-height: 50px;

    display: flex;

    align-items: flex-end;

    padding:
        5px 5px 5px 14px;

    border-radius: 25px;

    background:
        rgba(255,255,255,0.055);

    border:
        1px solid var(--border);

}


textarea {

    flex: 1;

    resize: none;

    max-height: 110px;

    padding:
        8px 4px;

    background:
        transparent;

    border: 0;

    outline: 0;

    color: white;

}


.send {

    width: 40px;
    height: 40px;

    border-radius: 50%;

    background:
        var(--purple);

    color: white;

    font-size: 17px;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-height: 700px) {

    .core-area {
        height: 35%;
        min-height: 240px;
    }

    .core {
        transform: scale(.82);
    }

    .welcome {
        padding-top: 0;
    }

}


/* =====================================================
   PARTICULES
===================================================== */

.particle {

    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background:
        var(--purple-light);

    box-shadow:
        0 0 8px
        var(--purple);

    opacity: .6;

    animation:
        particleFloat
        var(--duration)
        linear infinite;

}


@keyframes particleFloat {

    from {

        transform:
            rotate(var(--angle))
            translateX(100px);

        opacity: 0;

    }

    30% {
        opacity: .7;
    }

    70% {
        opacity: .7;
    }

    to {

        transform:
            rotate(
                calc(
                    var(--angle) + 360deg
                )
            )
            translateX(100px);

        opacity: 0;

    }

}

</style>
</head>


<body>

<div class="app">


<!-- ===================================================
     HEADER
=================================================== -->

<header class="header">

    <div class="brand">

        <div class="brand-icon">
            ✦
        </div>

        <div>

            <div class="brand-name">
                Asdrick AI
            </div>

            <div
                id="status"
                class="status"
            >
                ● EN LIGNE
            </div>

        </div>

    </div>


    <button
        id="clear"
        class="clear"
        type="button"
    >
        🗑️
    </button>

</header>


<!-- ===================================================
     CORE
=================================================== -->

<section class="core-area">

    <div class="grid"></div>


    <div
        id="core"
        class="core"
    >

        <div
            id="particles"
        ></div>


        <div class="ring one"></div>

        <div class="ring two"></div>

        <div class="ring three"></div>


        <div class="core-glow"></div>


        <div class="audio-bars">

            <span
                class="audio-bar"
                style="--height:1.8;--delay:.00s"
            ></span>

            <span
                class="audio-bar"
                style="--height:2.5;--delay:.08s"
            ></span>

            <span
                class="audio-bar"
                style="--height:1.4;--delay:.16s"
            ></span>

            <span
                class="audio-bar"
                style="--height:3;--delay:.24s"
            ></span>

            <span
                class="audio-bar"
                style="--height:2;--delay:.32s"
            ></span>

            <span
                class="audio-bar"
                style="--height:3.5;--delay:.40s"
            ></span>

            <span
                class="audio-bar"
                style="--height:2;--delay:.48s"
            ></span>

            <span
                class="audio-bar"
                style="--height:1.5;--delay:.56s"
            ></span>

            <span
                class="audio-bar"
                style="--height:2.7;--delay:.64s"
            ></span>

            <span
                class="audio-bar"
                style="--height:1.8;--delay:.72s"
            ></span>

        </div>


        <div class="core-ball">

            <div class="core-symbol">
                ✦
            </div>

        </div>


        <div class="core-label">
            ASDRICK CORE
        </div>

    </div>

</section>


<!-- ===================================================
     CHAT
=================================================== -->

<main
    id="chat"
    class="chat"
>

    <section
        id="welcome"
        class="welcome"
    >

        <h2>
            Salut Asdrick 👋
        </h2>

        <p>
            Je suis prêt.
        </p>


        <div class="suggestions">

            <button
                class="suggestion"
                data-command="Bonjour !"
            >
                👋 Bonjour
            </button>


            <button
                class="suggestion"
                data-command="Dis-moi quelque chose d'intéressant."
            >
                🧠 Surprends-moi
            </button>


            <button
                class="suggestion"
                data-command="Ouvre YouTube"
            >
                ▶️ YouTube
            </button>

        </div>

    </section>

</main>


<!-- ===================================================
     TYPING
=================================================== -->

<div
    id="typing"
    class="typing"
>

    <span></span>
    <span></span>
    <span></span>

</div>


<!-- ===================================================
     INPUT
=================================================== -->

<footer class="input-area">


    <button
        id="mic"
        class="mic"
        type="button"
        aria-label="Microphone"
    >
        🎙️
    </button>


    <div class="input-box">

        <textarea
            id="input"
            rows="1"
            placeholder="Écris ou parle..."
        ></textarea>


        <button
            id="send"
            class="send"
            type="button"
            aria-label="Envoyer"
        >
            ➤
        </button>

    </div>


</footer>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const API_URL =
    "https://asdrick-ia.onrender.com";


const SHORTCUTS = {

    open_youtube:
        "Asdrick YouTube",

    open_tiktok:
        "Asdrick TikTok",

    open_messages:
        "Asdrick Messages",

    open_amazon:
        "Asdrick Amazon",

    open_netflix:
        "Asdrick Netflix",

    open_revolut:
        "Asdrick Revolut",

    open_timer:
        "Asdrick Minuteur",

    open_alarm:
        "Asdrick Alarme"

};


/* =====================================================
   ELEMENTS
===================================================== */

const chat =
    document.getElementById("chat");

const welcome =
    document.getElementById("welcome");

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const mic =
    document.getElementById("mic");

const clear =
    document.getElementById("clear");

const typing =
    document.getElementById("typing");

const status =
    document.getElementById("status");

const core =
    document.getElementById("core");

const particles =
    document.getElementById("particles");


let sending = false;

let recognition = null;

let listening = false;

let speaking = false;

let currentUtterance = null;


/* =====================================================
   PARTICULES
===================================================== */

function createParticles() {

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const particle =
            document.createElement("div");


        particle.className =
            "particle";


        particle.style.setProperty(
            "--angle",
            `${Math.random() * 360}deg`
        );


        particle.style.setProperty(
            "--duration",
            `${5 + Math.random() * 8}s`
        );


        particle.style.animationDelay =
            `${Math.random() * -8}s`;


        particles.appendChild(
            particle
        );

    }

}


/* =====================================================
   ÉTAT CORE
===================================================== */

function setCoreState(
    state
) {

    core.classList.remove(
        "listening",
        "thinking",
        "speaking"
    );


    if (state) {

        core.classList.add(
            state
        );

    }


    if (state === "listening") {

        status.textContent =
            "● JE T'ÉCOUTE";

        status.className =
            "status listening";

    }

    else if (state === "thinking") {

        status.textContent =
            "● JE RÉFLÉCHIS...";

        status.className =
            "status thinking";

    }

    else if (state === "speaking") {

        status.textContent =
            "● JE PARLE...";

        status.className =
            "status speaking";

    }

    else {

        status.textContent =
            "● EN LIGNE";

        status.className =
            "status";

    }

}


/* =====================================================
   HISTORIQUE
===================================================== */

function getHistory() {

    try {

        const data =
            localStorage.getItem(
                "asdrick_history"
            );


        if (!data) {
            return [];
        }


        const parsed =
            JSON.parse(data);


        return Array.isArray(parsed)
            ? parsed
            : [];

    }

    catch {

        return [];

    }

}


function saveMessage(
    type,
    text
) {

    try {

        const history =
            getHistory();


        history.push({

            type,
            text,
            date:
                Date.now()

        });


        localStorage.setItem(
            "asdrick_history",
            JSON.stringify(
                history.slice(-50)
            )
        );

    }

    catch (error) {

        console.error(
            "Mémoire :",
            error
        );

    }

}


/* =====================================================
   AFFICHAGE MESSAGE
===================================================== */

function addMessage(
    type,
    text
) {

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message " + type;


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.textContent =
        String(text);


    row.appendChild(
        bubble
    );


    chat.appendChild(
        row
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* =====================================================
   CHARGER HISTORIQUE
===================================================== */

function loadHistory() {

    const history =
        getHistory();


    if (!history.length) {
        return;
    }


    welcome.style.display =
        "none";


    history.forEach(
        item => {

            if (
                !item ||
                (
                    item.type !== "user" &&
                    item.type !== "ai"
                )
            ) {

                return;

            }


            addMessage(
                item.type,
                item.text
            );

        }
    );

}


/* =====================================================
   ACTIONS
===================================================== */

function executeAction(
    action,
    url = null
) {

    if (
        action ===
        "open_website"
    ) {

        if (!url) {
            return;
        }


        window.location.href =
            url;


        return;

    }


    const shortcutName =
        SHORTCUTS[action];


    if (!shortcutName) {

        console.warn(
            "Action inconnue :",
            action
        );


        return;

    }


    const shortcutURL =
        "shortcuts://run-shortcut?name=" +
        encodeURIComponent(
            shortcutName
        );


    window.location.href =
        shortcutURL;

}


/* =====================================================
   ENVOYER
===================================================== */

async function sendMessage() {

    if (sending) {
        return;
    }


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    sending = true;


    stopSpeaking();


    input.value =
        "";


    welcome.style.display =
        "none";


    addMessage(
        "user",
        message
    );


    const history =
        getHistory()

            .filter(
                item =>
                    item &&
                    (
                        item.type ===
                        "user" ||
                        item.type ===
                        "ai"
                    )
            )

            .slice(-20)

            .map(
                item => ({

                    role:
                        item.type ===
                        "user"
                            ? "user"
                            : "assistant",

                    content:
                        item.text

                })
            );


    saveMessage(
        "user",
        message
    );


    setCoreState(
        "thinking"
    );


    typing.classList.add(
        "active"
    );


    try {

        const response =
            await fetch(
                API_URL +
                "/api/chat",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message,

                            history

                        })

                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (
            !data ||
            typeof data.reply !==
                "string"
        ) {

            throw new Error(
                "Réponse invalide"
            );

        }


        typing.classList.remove(
            "active"
        );


        addMessage(
            "ai",
            data.reply
        );


        saveMessage(
            "ai",
            data.reply
        );


        if (data.action) {

            executeAction(
                data.action,
                data.url
            );

        }


        speak(
            data.reply
        );

    }

    catch (error) {

        console.error(
            "Erreur API :",
            error
        );


        typing.classList.remove(
            "active"
        );


        addMessage(
            "ai",
            "❌ Je n'arrive pas à contacter mon serveur."
        );


        setCoreState(
            null
        );

    }

    finally {

        sending =
            false;

    }

}


/* =====================================================
   VOIX
===================================================== */

function cleanTextForVoice(
    text
) {

    if (!text) {
        return "";
    }


    return String(text)

        .replace(
            /[\u{1F300}-\u{1FAFF}]/gu,
            ""
        )

        .replace(
            /[*_`#]/g,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


function getFrenchVoice() {

    if (
        !("speechSynthesis" in window)
    ) {

        return null;

    }


    const voices =
        speechSynthesis.getVoices();


    const french =
        voices.filter(
            voice =>
                voice.lang &&
                voice.lang
                    .toLowerCase()
                    .startsWith("fr")
        );


    if (!french.length) {

        return null;

    }


    const preferred =
        french.find(
            voice =>
                /premium|enhanced|natural|neural/i
                    .test(
                        voice.name
                    )
        );


    return preferred ||
        french[0];

}


function speak(
    text
) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    const clean =
        cleanTextForVoice(
            text
        );


    if (!clean) {
        return;
    }


    speechSynthesis.cancel();


    currentUtterance =
        new SpeechSynthesisUtterance(
            clean
        );


    currentUtterance.lang =
        "fr-FR";


    currentUtterance.rate =
        0.96;


    currentUtterance.pitch =
        1;


    currentUtterance.volume =
        1;


    const voice =
        getFrenchVoice();


    if (voice) {

        currentUtterance.voice =
            voice;

    }


    currentUtterance.onstart =
        () => {

            speaking =
                true;


            setCoreState(
                "speaking"
            );

        };


    currentUtterance.onend =
        () => {

            speaking =
                false;


            currentUtterance =
                null;


            setCoreState(
                null
            );

        };


    currentUtterance.onerror =
        error => {

            console.error(
                "Voix :",
                error
            );


            speaking =
                false;


            currentUtterance =
                null;


            setCoreState(
                null
            );

        };


    speechSynthesis.speak(
        currentUtterance
    );

}


function stopSpeaking() {

    if (
        "speechSynthesis"
        in window
    ) {

        speechSynthesis.cancel();

    }


    speaking =
        false;


    currentUtterance =
        null;


    setCoreState(
        null
    );

}


/* =====================================================
   MICRO
===================================================== */

function setupVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        mic.disabled =
            true;


        mic.style.opacity =
            ".4";


        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "fr-FR";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        () => {

            listening =
                true;


            stopSpeaking();


            mic.classList.add(
                "listening"
            );


            setCoreState(
                "listening"
            );

        };


    recognition.onresult =
        event => {

            try {

                const result =
                    event
                        .results[0][0]
                        .transcript
                        .trim();


                if (!result) {
                    return;
                }


                input.value =
                    result;


                sendMessage();

            }

            catch (error) {

                console.error(
                    "Résultat vocal :",
                    error
                );

            }

        };


    recognition.onerror =
        error => {

            console.error(
                "Micro :",
                error
            );


            stopListening();


            if (
                error.error ===
                "not-allowed"
            ) {

                addMessage(
                    "ai",
                    "🎙️ Autorise le microphone dans les réglages du navigateur."
                );

            }

        };


    recognition.onend =
        () => {

            stopListening();

        };

}


function startListening() {

    if (
        !recognition ||
        listening
    ) {

        return;

    }


    stopSpeaking();


    try {

        recognition.start();

    }

    catch (error) {

        console.error(
            "Micro :",
            error
        );

    }

}


function stopListening() {

    listening =
        false;


    mic.classList.remove(
        "listening"
    );


    if (!sending) {

        setCoreState(
            null
        );

    }

}


mic.addEventListener(
    "click",
    () => {

        if (!recognition) {

            addMessage(
                "ai",
                "🎙️ La reconnaissance vocale n'est pas disponible ici."
            );


            return;

        }


        if (listening) {

            try {

                recognition.stop();

            }

            catch {}

        }

        else {

            startListening();

        }

    }
);


/* =====================================================
   SUGGESTIONS
===================================================== */

document
    .querySelectorAll(
        "[data-command]"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    input.value =
                        button.dataset.command;


                    sendMessage();

                }
            );

        }
    );


/* =====================================================
   ENTER
===================================================== */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
                "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   EFFACER
===================================================== */

clear.addEventListener(
    "click",
    () => {

        localStorage.removeItem(
            "asdrick_history"
        );


        chat
            .querySelectorAll(
                ".message"
            )
            .forEach(
                element =>
                    element.remove()
            );


        welcome.style.display =
            "block";


        stopSpeaking();

    }
);


/* =====================================================
   INIT
===================================================== */

createParticles();

loadHistory();

setupVoice();


if (
    "speechSynthesis"
    in window
) {

    speechSynthesis.onvoiceschanged =
        () => {

            getFrenchVoice();

        };

}

</script>
